name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Inspect token format
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          value="$CLOUDFLARE_API_TOKEN"
          echo "token length: ${#value}"
          if printf '%s' "$value" | grep -q '[[:space:]]'; then
            echo "token contains whitespace"
          else
            echo "token has no whitespace"
          fi
          case "$value" in
            https://*) echo "token looks like a URL" ;;
            *.*) echo "token contains a dot" ;;
            *) echo "token has no dot" ;;
          esac

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name=portfolio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 936124f2f5a10fbc0e3e445c30927f93
